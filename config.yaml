project:
  name: Taiwan AQI Prediction and Air Pollution Anomaly Detection Dashboard
  slug: aqi-anomaly-dashboard
random_state: 42
sample_mode: true
api:
  provider: moenv_aqx_p_432
  url: ""
  timeout_seconds: 20
  limit: 1000
data:
  raw_dir: data/raw
  stale_after_hours: 3
  sample_file: data/sample/sample_aqi.csv
  cleaned_file: data/processed/aqi_cleaned.csv
  features_file: data/processed/aqi_features.csv
  predictions_file: data/processed/aqi_predictions.csv
  anomaly_file: data/processed/aqi_anomaly_results.csv
  events_file: data/processed/aqi_anomaly_events.csv
models:
  predictor: models/aqi_predictor.joblib
  anomaly_detector: models/anomaly_detector.joblib
reports:
  metrics_dir: reports/metrics
  figures_dir: reports/figures
  confidence_file: reports/metrics/forecast_confidence.json
  source_metadata_file: reports/metrics/source_metadata.json
selected_sites:
  - 松山測站
  - 西屯測站
  - 前金測站
  - 安南測站
  - 花蓮測站
train:
  validation_ratio: 0.15
  test_ratio: 0.2
  backtest_folds: 3
  feature_columns:
    - aqi
    - pm25
    - pm10
    - o3
    - co
    - wind_speed
    - hour
    - day_of_week
    - month
    - is_weekend
    - station_hour_baseline_aqi
    - lag_1_aqi
    - lag_3_aqi
    - rolling_3h_aqi
    - rolling_6h_aqi
    - rolling_12h_aqi
    - pm25_lag_1
    - pm25_rolling_3h
    - aqi_diff
    - pm25_diff
forecast_confidence:
  levels:
    - 0.8
    - 0.95
  aqi_thresholds: [50, 100, 150, 200, 300]
anomaly:
  contamination: 0.05
  zscore_threshold: 2.5
  pseudo_aqi_threshold: 100
  pseudo_pm25_threshold: 35
  event_gap_hours: 1
risk_policy:
  lookback_days: 14
  recent_window_hours: 6
  min_baseline_observations: 3
  aqi_attention_threshold: 50
  aqi_high_threshold: 100
  pm25_threshold: 35
  baseline_zscore_watch: 1.0
  baseline_zscore_high: 2.0
  prediction_rise_threshold: 10
  weights:
    aqi_attention: 1
    aqi_high: 2
    pm25_high: 1
    baseline_watch: 1
    baseline_high: 2
    prediction_high: 1
    prediction_rise: 1
    anomaly_flag: 3
    anomaly_consensus: 1