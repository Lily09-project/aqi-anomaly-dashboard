project:
  name: Taiwan Air Lab
  slug: aqi-anomaly-dashboard
random_state: 42
sample:
  # Fixed end date keeps the synthetic data byte-for-byte reproducible.
  end_date: "2026-10-20"
  days: 60
api:
  # CAMS global model estimates are public without registration or an API key.
  provider: open_meteo_cams_global
  past_days: 60
  minimum_history_days: 30
data:
  raw_dir: data/raw
  sample_file: data/sample/sample_aqi.csv
  cleaned_file: data/processed/aqi_cleaned.csv
reports:
  source_metadata_file: reports/metrics/source_metadata.json
