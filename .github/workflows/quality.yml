name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  python:
    name: Python pipeline and analytics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock-py312.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements.txt -c requirements-lock-py312.txt
          python -m pip check
      - name: Validate public release contents
        run: python scripts/validate_public_release.py
      - name: Compile Python sources
        run: python -m compileall -q run_all.py src scripts tests
      - name: Run tests with analytics coverage gate (Q1 ≥ 90%)
        shell: bash
        run: |
          set -o pipefail
          python -W error -m pytest -q --color=no --tb=short \
            --cov=src.analytics --cov=src.export_web --cov-report=term-missing --cov-fail-under=90 2>&1 | tee pytest.log
      - name: Surface the pytest failure as an annotation
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          log = Path("pytest.log")
          tail = log.read_text(encoding="utf-8", errors="replace").splitlines()[-80:] if log.exists() else ["pytest.log missing"]
          body = "%0A".join(line.replace("%", "%25") for line in tail)
          print(f"::error title=pytest failed::{body}")
      - name: Prove the pipeline and export are reproducible (Q7)
        shell: bash
        run: |
          python -c "from pathlib import Path; from run_all import run; run('sample', Path('${RUNNER_TEMP}/export-a'))"
          python -c "from pathlib import Path; from run_all import run; run('sample', Path('${RUNNER_TEMP}/export-b'))"
          diff -r "${RUNNER_TEMP}/export-a" "${RUNNER_TEMP}/export-b"
          cat "${RUNNER_TEMP}/export-a/manifest.json"

  web:
    name: Web app (types, lint, unit, build, budget, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock-py312.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate data and export it for the web app
        working-directory: .
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements.txt -c requirements-lock-py312.txt
          python run_all.py --mode sample
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (Q2)
        run: npm run typecheck
      - name: Lint (Q2)
        run: npm run lint
      - name: Unit tests with coverage gate (Q3 ≥ 85%)
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Performance budget (Q6)
        run: npm run size
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: End-to-end journeys, accessibility and security (Q4, Q5, Q8)
        env:
          CI: "1"
        run: npm run e2e -- --grep-invert "正式公開"
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Validate Windows one-click launcher
        shell: cmd
        run: |
          call run_project.bat --validate > launcher.log 2>&1
          set "LAUNCHER_EXIT=%ERRORLEVEL%"
          type launcher.log
          exit /b %LAUNCHER_EXIT%
      - name: Surface the launcher failure as an annotation
        if: failure()
        shell: python
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          from pathlib import Path
          tail = Path("launcher.log").read_text(encoding="utf-8", errors="replace").splitlines()[-80:]
          body = "%0A".join(line.replace("%", "%25").replace("\r", "") for line in tail)
          print(f"::error title=run_project.bat --validate failed::{body}")

  public-api-integration:
    name: Live no-auth public API integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements.txt -c requirements-lock-py312.txt
          python -m pip check
      - name: Fetch and process real public data without credentials
        run: python run_all.py --mode api --require-api
      - name: Confirm the published dataset is source-backed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path("reports/metrics/source_metadata.json").read_text(encoding="utf-8"))
          public = json.loads(Path("web/public/data/provenance.json").read_text(encoding="utf-8"))
          assert source["provider"] == "open_meteo_cams_global"
          assert source["status"] == "success"
          assert source["data_source"] == "Model Estimate"
          assert source.get("is_simulated_data") is False
          assert source.get("row_count", 0) > 0
          assert public["provider"] == "open_meteo_cams_global"
          assert public["is_model_estimate"] is True
          assert public["is_simulated"] is False
          assert public["rows"] > 0
          assert public["input_sha256"] == source["data_file_sha256"]
          print(f"Verified {source['row_count']} source rows from {source['provider']}")
          PY

      - name: Install locked web dependencies for live-data acceptance
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build the web app with real public data
        working-directory: web
        run: npm run typecheck && npm run build && npm run size
      - name: Install Chromium for live-data acceptance
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify real-data user paths across viewports
        working-directory: web
        env:
          CI: "1"
        run: npm run e2e -- e2e/production-data.spec.ts
