name: Quality Gate

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate public release contents
        run: python scripts/validate_public_release.py
      - name: Run reproducible sample pipeline
        run: python run_all.py --mode sample
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --color=no --tb=short 2>&1 | tee pytest-output.txt
      - name: Publish test diagnostics
        if: always()
        run: |
          {
            echo "## Pytest output"
            echo '```text'
            if [ -f pytest-output.txt ]; then
              tail -n 200 pytest-output.txt
            else
              echo "pytest-output.txt was not created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
