name: Quality Gate

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate public release contents
        run: python scripts/validate_public_release.py
      - name: Run reproducible sample pipeline
        run: python run_all.py --mode sample
      - name: Run tests
        run: pytest -q
