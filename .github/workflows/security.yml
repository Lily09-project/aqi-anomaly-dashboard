name: Security Audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - name: Block generated data and model artifacts from Git
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- \
            'data/raw/*.csv' \
            'data/sample/*.csv' \
            'data/processed/*.csv' \
            'models/*.joblib' \
            'reports/figures/*.png' \
            'reports/metrics/*.json')
          if [[ -n "$tracked" ]]; then
            echo "Generated artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi
