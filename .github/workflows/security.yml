name: Security Audit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-security.txt
      - name: Validate public release contents
        run: python scripts/validate_public_release.py
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements-lock-py312.txt --no-deps
      - name: Run high-severity static security scan
        run: python -m bandit -q --severity-level high --confidence-level high -r app.py src scripts
      - name: Block generated data and model artifacts from Git
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- \
            'data/raw/*.csv' \
            'data/sample/*.csv' \
            'data/processed/*.csv' \
            'models/*.joblib' \
            'reports/figures/*.png' \
            'reports/metrics/*.json')
          if [[ -n "$tracked" ]]; then
            echo "Generated artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi
