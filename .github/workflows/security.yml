name: Security Audit

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-security.txt
      - name: Validate public release contents
        run: python scripts/validate_public_release.py
      - name: Run high-severity static security scan
        run: python -m bandit -q --severity-level high --confidence-level high -r src scripts run_all.py
      - name: Run Ruff correctness gate
        run: python -m ruff check src scripts tests run_all.py
      - name: Block generated data and model artifacts from Git
        shell: bash
        run: |
          set -euo pipefail
          tracked=$(git ls-files -- \
            'data/raw/*.csv' \
            'data/sample/*.csv' \
            'data/processed/*.csv' \
            'web/public/data/*.json' \
            'reports/metrics/*.json')
          if [[ -n "$tracked" ]]; then
            echo "Generated artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi

  # Independent and mandatory: audit failure must not hide source validation.
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install audit tools
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-security.txt
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirements-lock-py312.txt --no-deps

  web-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit locked web dependencies
        working-directory: web
        run: npm audit --audit-level=high
